  :root{
    --negro:#080A0D; --hueso:#EDF1F5; --gris:#78848F; --linea:#2C353F; --azul:#2F6FE4;
    box-sizing:border-box;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:var(--negro)}
  body{
    font-family:'Margem',system-ui,-apple-system,sans-serif;
    color:var(--hueso); overflow:hidden;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  iframe{width:100%;height:100%;border:0;display:block;background:var(--negro)}

  .carga{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;background:var(--negro);
    transition:opacity .35s; z-index:2;
  }
  .carga.fuera{opacity:0;pointer-events:none}
  .marca{font-size:14px;letter-spacing:.24em;font-weight:700;text-transform:uppercase}
  .marca span{color:var(--gris);font-weight:500}
  .punto{width:34px;height:4px;border-radius:100px;background:var(--linea);overflow:hidden}
  .punto i{display:block;height:100%;width:40%;background:var(--azul);border-radius:100px;
    animation:va 1s ease-in-out infinite alternate}
  @keyframes va{from{transform:translateX(-60%)}to{transform:translateX(220%)}}
  @media (prefers-reduced-motion:reduce){.punto i{animation:none;width:100%}}

  .error{
    position:fixed;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:center;gap:12px;padding:30px;text-align:center;background:var(--negro);z-index:3;
  }
  .error p{color:var(--gris);font-size:14px;line-height:1.55;max-width:34ch}
  .error a{color:var(--azul);font-size:14px}

</style>
</head>
<body>

<div class="carga" id="carga">
  <div class="marca">PADEL<span>ZONE</span></div>
  <div class="punto"><i></i></div>
</div>


<div class="error" id="error">
  <div class="marca">PADEL<span>ZONE</span></div>
  <p id="error-txt">No se pudo abrir la aplicación.</p>
  <a id="error-link" href="#">Abrir en el navegador</a>
</div>

<iframe id="app" title="Padel Zone" allow="clipboard-write; fullscreen"></iframe>

<script>
/**
 * Lanzador de Padel Zone.
 *
 * Existe porque Apps Script sirve sus vistas dentro de un iframe de Google,
 * así que el ícono de "Agregar a pantalla de inicio" toma el ícono de Google
 * y no el nuestro. Esta página sí es nuestra: el teléfono guarda este ícono
 * y este nombre, y adentro carga la app.
 *
 * Pasa los parámetros tal cual, así un mismo archivo sirve las vistas:
 *   index.html?t=TOKEN     → tarjeta del socio
 *   index.html?v=escaner   → escáner de recepción
 *   index.html?v=armado    → armar partida grupal
 *   index.html?v=socios    → alta y cobro
 */

const marco = document.getElementById("app");
const carga = document.getElementById("carga");
let reloj = null;

function mostrarError(msg, url) {
  carga.classList.add("fuera");
  const caja = document.getElementById("error");
  caja.style.display = "flex";
  document.getElementById("error-txt").textContent = msg;
  const a = document.getElementById("error-link");
  if (url) { a.href = url; } else { a.style.display = "none"; }
}

function iniciar() {
  const APP = (window.PZ_CONFIG && window.PZ_CONFIG.app) || "";

  if (!APP || APP.indexOf("PEGA_AQUI") >= 0) {
    mostrarError("Falta configurar la URL de la aplicación en config.js.", null);
    return;
  }

  const params = location.search || "";
  if (!params) {
    mostrarError("Abrí el enlace que te enviaron por WhatsApp para ver tu membresía.", null);
    return;
  }

  // El navegador guarda la página que carga el iframe y se queda con ella
  // aunque el sistema cambie. Un parámetro distinto en cada apertura obliga
  // a pedirla de nuevo: si no, el socio ve el saldo del día que la abrió.
  const destino = APP + params + "&_=" + Date.now();

  marco.addEventListener("load", () => {
    carga.classList.add("fuera");
    clearTimeout(reloj);
  });

  reloj = setTimeout(() => {
    mostrarError("La aplicación está tardando en responder.", destino);
  }, 12000);

  marco.src = destino;
}

// config.js se pide con un valor distinto cada vez: es el archivo que se
// edita al instalar, y si el navegador lo guarda, los cambios no llegan.
(function () {
  const s = document.createElement("script");
  s.src = "config.js?_=" + Date.now();
  s.onload = iniciar;
  s.onerror = () => mostrarError("No se encontró config.js en el servidor.", null);
  document.head.appendChild(s);
})();
</script>
</body>
</html>
